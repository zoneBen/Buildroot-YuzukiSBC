name: Build Lichee Pi Zero Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: recursive
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Cache Buildroot Download
      id: cache-download
      uses: actions/cache@v3
      with:
        path: buildroot/dl
        key: ${{ runner.os }}-buildroot-dl-${{ hashFiles('buildroot/dl/**') }}
        restore-keys: |
          ${{ runner.os }}-buildroot-dl-
          
    - name: Set up QEMU Emulation
      uses: docker/setup-qemu-action@v2
      with:
        platforms: arm,arm64
        
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget cpio python3 unzip rsync bc bzip2 tar gzip xz-utils zip libssl-dev flex bison g++ gawk gcc-multilib gperf texinfo qemu-user-static

    - name: Configure Environment
      run: |
        pwd
        ls -la
        echo "Setting up environment..."
        source envsetup.sh || true
        
    - name: Lunch Buildroot Environment
      run: |
        # Source the environment setup script
        source ./envsetup.sh || true
        # Change to buildroot directory
        cd buildroot
        # Show available configs
        make list-defconfigs | grep -i lichee
        # Show the target config file
        ls -la configs/sipeed_lichee_zero_defconfig
        
    - name: Build Lichee Pi Zero Config
      run: |
        source ./envsetup.sh || true
        # Change to buildroot directory
        cd buildroot
        export BR2_JLEVEL=$(nproc)
        echo "Building with sipeed_lichee_zero_defconfig..."
        make sipeed_lichee_zero_defconfig
        echo "Config built successfully"
        
    - name: Compile Buildroot
      run: |
        source ./envsetup.sh || true
        # Change to buildroot directory
        cd buildroot
        export BR2_JLEVEL=$(nproc)
        echo "Starting build process for Lichee Pi Zero..."
        time make -j$(nproc)
        echo "Build completed"
        
    - name: Check Output Files
      run: |
        cd buildroot
        ls -la output/images/
        ls -la output/images/* || true
        echo "Checking for firmware files..."
        find output/images -type f -name "*.img" -exec ls -la {} \;
        echo "Looking for sdcard.img specifically..."
        ls -la output/images/sdcard.img || echo "sdcard.img not found"
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: lichee-pi-zero-firmware
        path: |
          buildroot/output/images/sdcard.img
          buildroot/output/images/*.dtb
          buildroot/output/images/zImage
          buildroot/output/images/u-boot*
          buildroot/output/images/rootfs.*
        if-no-files-found: warn